[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-pilgrimage-planner"
version = "0.3.0"
description = "Agentic anime pilgrimage trip planner powered by LangGraph and OpenRouter LLMs/VLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=0.3.0",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "rich>=13.9.0",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
pilgrimage = "anime_pilgrimage.cli:main"
pilgrimage-api = "anime_pilgrimage.api:run_server"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anime_pilgrimage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
